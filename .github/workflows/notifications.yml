name: Notifications
on:
  schedule:
    - cron: '15 5 * * *'   # séance du jour : 6 h 15 (hiver) / 7 h 15 (été) à Zurich
    - cron: '0 18 * * 0'   # dimanche soir : aperçu de la semaine
  workflow_dispatch:
    inputs:
      mode: { description: 'daily ou weekly', default: 'daily' }
permissions: { contents: read }
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/notify.mjs "${{ github.event.inputs.mode || (github.event.schedule == '0 18 * * 0' && 'weekly' || 'daily') }}"
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
